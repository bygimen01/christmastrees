name: Deploy GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve GitHub Pages paths
        env:
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"

          if [[ "$REPOSITORY_NAME" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            BASE_PATH="/"
            DEFAULT_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io"
          else
            BASE_PATH="/${REPOSITORY_NAME}/"
            DEFAULT_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPOSITORY_NAME}"
          fi

          if [[ -n "$SITE_URL_OVERRIDE" ]]; then
            RESOLVED_SITE_URL="${SITE_URL_OVERRIDE%/}"
          else
            RESOLVED_SITE_URL="$DEFAULT_SITE_URL"
          fi

          echo "BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "SITE_URL=$RESOLVED_SITE_URL" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=$RESOLVED_SITE_URL" >> "$GITHUB_ENV"

      - name: Build
        env:
          VITE_ORDER_API_URL: ${{ vars.VITE_ORDER_API_URL }}
        run: npm run build -- --base="$BASE_PATH"

      - name: Prepare SPA fallback
        shell: bash
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
